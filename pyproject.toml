[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saregama"
version = "0.1.0"
description = "Time-synced annotation of Carnatic concert recordings (stems, F0, swaras, lyrics) into ICM-IR and SoulX-Singer training data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<2.3", "scipy>=1.10", "soundfile>=0.12", "matplotlib>=3.8", "pyyaml>=6",
                "pandas>=2", "pyarrow>=15", "scikit-learn>=1.3"]

[project.optional-dependencies]
models = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers>=4.40,<4.42",  # SoulX-Singer is tested with 4.41.2; 5.x needs torch >= 2.6
  "torchfcpe",
  "torchcrepe",
  "librosa>=0.10",
  "einops",
  "huggingface_hub",
  # imported by SoulX-Singer's Mel-RoFormer separator (stage `stems`)
  "ml_collections", "accelerate",
  "omegaconf",
  "rotary_embedding_torch",
  "beartype",
  "loralib",
  "wandb",
]
web = ["requests", "beautifulsoup4"]
test = ["pytest"]

[project.scripts]
saregama = "saregama.cli:main"

[tool.setuptools.packages.find]
include = ["saregama*", "annotator_model*"]
